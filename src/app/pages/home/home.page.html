<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="ion-text-center ion-title-bold"> Mis Tareas </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-item>
    <ion-input type="text" placeholder="Nueva Tarea" name="task" [(ngModel)]="task" />

    <ion-button (click)="addTask()" [disabled]="!task">
      <ion-icon name="add-outline"></ion-icon>
    </ion-button>
  </ion-item>

  @if (tasks.length == 0) {
    <ion-item class="ion-text-center" lines="none">
      <ion-label>No hay tareas pendientes</ion-label>
    </ion-item>
  } @else {
   <ion-list>
   <ion-reorder-group [disabled]="false" (ionItemReorder)="handleReorder($event)">
    @for (taskItem of tasks; track taskItem) {
      <ion-item-sliding #slidingItem>
        <ion-item>
          <ion-label>{{taskItem}}</ion-label>
          <ion-reorder slot="end"></ion-reorder>
        </ion-item>
        <ion-item-options side="end">
          <ion-item-option color="danger" (click)="confirmDeleteTask(taskItem)">
            <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
          </ion-item-option>
          <ion-item-option>Favorite</ion-item-option> 
        </ion-item-options>
      </ion-item-sliding>
    }
  </ion-reorder-group>
</ion-list>
  }
</ion-content>
