<ion-header>
  <ion-toolbar>
    <ion-title class="ion-text-center">Mis Tareas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Entrada para agregar tareas -->
  <ion-item>
    <ion-input 
      [(ngModel)]="task" 
      placeholder="Escribe una tarea...">
    </ion-input>
    <ion-button (click)="addTask()" slot="end">
      <ion-icon name="add-outline"></ion-icon>
    </ion-button>
  </ion-item>

  <!-- Lista de tareas agregadas -->
  <ion-list>
    <ion-item *ngFor="let t of tasks">
      <ion-label>{{ t }}</ion-label>
    </ion-item>
  </ion-list>

</ion-content>
